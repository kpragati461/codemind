server:
  port: 8080

spring:
  application:
    name: codemind-api
  datasource:
    url: jdbc:h2:file:./data/codemind;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

codemind:
  workspace: ${CODEMIND_WORKSPACE:${user.home}/.codemind}
  analysis-url: ${CODEMIND_ANALYSIS_URL:http://localhost:8000}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/codemind
    username: codemind
    password: codemind
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
